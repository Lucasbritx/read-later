<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Read Later</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header>
        <p class="eyebrow">Read Later</p>
        <h1>Save this tab</h1>
      </header>

      <section id="auth-view" class="panel">
        <form id="auth-form" class="stack">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />

          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            minlength="6"
            required
          />

          <button id="sign-in-button" class="primary-button" type="submit">Sign in</button>
        </form>
      </section>

      <section id="save-view" class="panel" hidden>
        <div class="tab-preview">
          <p id="tab-title" class="tab-title">Current tab</p>
          <p id="tab-url" class="tab-url"></p>
        </div>

        <div class="button-row">
          <button id="save-button" class="primary-button" type="button">Save current tab</button>
          <button id="sign-out-button" class="secondary-button" type="button">Sign out</button>
        </div>
      </section>

      <p id="status-message" class="status-message" role="status"></p>
    </main>

    <script src="config.js"></script>
    <script type="module" src="popup.js"></script>
  </body>
</html>
